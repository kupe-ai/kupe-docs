openapi: 3.1.0
info:
  title: Kupe API
  version: 0.1.0
  description: 'Public Kupe REST API. Authenticate with `Authorization: Bearer sk-kupe-...` (project API
    key) or a Supabase user JWT. API-key callers can GET /v1/me for the org_id and project_id scoped to
    the key.'
paths:
  /v1/me:
    get:
      tags:
      - Me
      summary: Current principal
      description: Auth type plus, for API keys, the org and project scoped to the key.
      operationId: get_me_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
      x-codeSamples:
      - lang: python
        label: Python
        source: |-
          from kupe import Kupe

          client = Kupe()  # KUPE_API_KEY
          me = client.me()
          print(me.org_id, me.project_id)
      - lang: typescript
        label: TypeScript
        source: |-
          import { Kupe } from "kupe-sdk";

          const kupe = new Kupe(); // KUPE_API_KEY
          const me = await kupe.me();
          console.log(me.org_id, me.project_id);
      - lang: bash
        label: cURL
        source: |-
          curl https://x.kupe.in/v1/me \
            -H "Authorization: Bearer sk-kupe-YOUR_KEY"
