      properties:
        mode:
          type: string
          enum:
          - 'off'
          - sounds
          - words
          - auto
          title: Mode
          default: auto
        enabled:
          type: boolean
          title: Enabled
          default: true
      type: object
      title: ThinkingSoundsConfig
      description: "Short language-specific filler spoken via TTS as soon as the user turn\nends, while\
        \ the real reply is still generating.\n\n`mode` picks the vocabulary:\n  \"off\"     — say nothing.\n\
        \  \"sounds\"  — non-lexical hesitation (hmm, अं, ம்ம்).\n  \"words\"   — a real acknowledgement\
        \ in the agent's language\n              (अच्छा / ठीक है / બરાબર / சரி / \"got it\").\n  \"auto\"\
        \    — the ThinkSpark model picks a context-aware spark on CPU from\n              the caller's\
        \ last turn + recent conversation, in the right\n              language/script/register/emotion.\
        \ When \"auto\" is selected the\n              agent's own LLM is instructed NOT to produce reactions/fillers\n\
        \              (ThinkSpark speaks them), and ThinkSpark's latency is reported\n              to\
        \ PostHog. This is the default for new agents.\n\n`enabled` is the pre-`mode` boolean. It is kept\
        \ in the payload and mirrors\n`mode != \"off\"` so older clients and running workers keep working;\
        \ new\nwriters should send `mode`."
